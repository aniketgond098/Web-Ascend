<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Cyber-Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#1A0814" />
    </linearGradient>

    <!-- Spider Crimson Gradient -->
    <linearGradient id="spiderRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3355" />
      <stop offset="45%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="spiderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#EF4444" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Aesthetic Cyber-Shield Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shieldGrad)" stroke="#EF4444" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Subtle Web Lattice Matrix -->
  <g opacity="0.25" stroke="#38BDF8" stroke-width="0.75">
    <line x1="32" y1="3" x2="32" y2="61" stroke="#EF4444" stroke-width="0.8" />
    <line x1="3" y1="32" x2="61" y2="32" stroke="#EF4444" stroke-width="0.8" />
    <line x1="11" y1="11" x2="53" y2="53" />
    <line x1="53" y1="11" x2="11" y2="53" />
    <!-- Concentric Cyber-Web Diamonds -->
    <polygon points="32,13 51,32 32,51 13,32" fill="none" stroke="#EF4444" stroke-width="0.8" />
    <polygon points="32,21 43,32 32,43 21,32" fill="none" stroke="#38BDF8" stroke-width="0.6" />
  </g>

  <!-- Stark Tactical Corner Bracket Accents -->
  <path d="M7 14 L7 7 L14 7" stroke="#38BDF8" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <path d="M57 14 L57 7 L50 7" stroke="#EF4444" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <path d="M7 50 L7 57 L14 57" stroke="#EF4444" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <path d="M57 50 L57 57 L50 57" stroke="#38BDF8" stroke-width="1.6" fill="none" stroke-linecap="round" />

  <!-- Iconic Spider-Man Geometric Cyber Emblem -->
  <g filter="url(#spiderGlow)">
    <!-- Central Abdomen (Lower Hexagonal Diamond) -->
    <path d="M32 25 L38 36 L32 51 L26 36 Z" fill="url(#spiderRed)" stroke="#FF4D6D" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Cephalothorax (Upper Angular Diamond Head) -->
    <path d="M32 14 L37 22 L32 27 L27 22 Z" fill="url(#spiderRed)" stroke="#FF4D6D" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Stark Arc Core Node -->
    <circle cx="32" cy="24.5" r="1.8" fill="#FFFFFF" />

    <!-- Spider Legs: Left Quad -->
    <path d="M28 18 L18 11 L12 16" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M27 22 L14 19 L9 27" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M27 31 L15 34 L11 44" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 38 L19 45 L16 54" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Spider Legs: Right Quad -->
    <path d="M36 18 L46 11 L52 16" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M37 22 L50 19 L55 27" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M37 31 L49 34 L53 44" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35 38 L45 45 L48 54" stroke="url(#spiderRed)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Micro Tech Node Accents -->
    <circle cx="12" cy="16" r="1.2" fill="#FF8096" />
    <circle cx="52" cy="16" r="1.2" fill="#FF8096" />
    <circle cx="16" cy="54" r="1.2" fill="#FF8096" />
    <circle cx="48" cy="54" r="1.2" fill="#FF8096" />
  </g>
</svg>
