<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spideyBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="65%" stop-color="#9F1239" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <!-- Dark Carbon Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Eye Lens Pure Glow -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Cyber Cyan Edge Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Lens Shadow -->
    <filter id="lensShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#020617" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with High Contrast Dark Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#rimGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Inner Vibrant Mask Face Oval -->
  <path d="M 10 24 C 10 12, 20 6, 32 6 C 44 6, 54 12, 54 24 C 54 40, 42 56, 32 58 C 22 56, 10 40, 10 24 Z" fill="url(#spideyBg)" stroke="#090D16" stroke-width="1.8" />

  <!-- Web Lines radiating across the mask -->
  <g stroke="#0F172A" stroke-width="1.1" stroke-opacity="0.75" fill="none">
    <!-- Vertical Center Spine -->
    <line x1="32" y1="6" x2="32" y2="58" />
    <!-- Diagonal Radial Strands -->
    <path d="M 32 20 Q 22 14 13 14" />
    <path d="M 32 20 Q 42 14 51 14" />
    <path d="M 32 28 Q 18 24 10 26" />
    <path d="M 32 28 Q 46 24 54 26" />
    <path d="M 32 36 Q 20 38 13 42" />
    <path d="M 32 36 Q 44 38 51 42" />
    <path d="M 32 45 Q 24 49 19 53" />
    <path d="M 32 45 Q 40 49 45 53" />
    <!-- Concentric Web Rings -->
    <path d="M 24 10 Q 32 14 40 10" />
    <path d="M 18 19 Q 32 25 46 19" />
    <path d="M 21 44 Q 32 40 43 44" />
  </g>

  <!-- Iconic Angular Spider Eyes (Black Outer Borders) -->
  <g filter="url(#lensShadow)">
    <!-- Left Eye Outer Frame -->
    <path d="M 14 26 Q 22 22 30 30 Q 24 43 15 41 Q 12 33 14 26 Z" fill="#090D16" stroke="#020617" stroke-width="1" />
    <!-- Right Eye Outer Frame -->
    <path d="M 50 26 Q 42 22 34 30 Q 40 43 49 41 Q 52 33 50 26 Z" fill="#090D16" stroke="#020617" stroke-width="1" />

    <!-- Left Eye White Glowing Lens -->
    <path d="M 16 27.5 Q 22.5 24 28 30 Q 23.5 39 17 38 Q 14.5 32 16 27.5 Z" fill="url(#lensGrad)" />
    <!-- Right Eye White Glowing Lens -->
    <path d="M 48 27.5 Q 41.5 24 36 30 Q 40.5 39 47 38 Q 49.5 32 48 27.5 Z" fill="url(#lensGrad)" />

    <!-- Sleek Highlights on Lenses -->
    <path d="M 18 28.5 Q 22 26 25 30" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 46 28.5 Q 42 26 39 30" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>

  <!-- Corner Tech HUD Accents for Web Ascend Cyber Vibe -->
  <path d="M 5 11 L 5 5 L 11 5" stroke="url(#cyanAccent)" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 59 11 L 59 5 L 53 5" stroke="#E11D48" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 5 53 L 5 59 L 11 59" stroke="#E11D48" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 59 53 L 59 59 L 53 59" stroke="url(#cyanAccent)" stroke-width="1.5" fill="none" stroke-linecap="round" />
</svg>
